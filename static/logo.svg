
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     fill="none">

  <defs>
    <linearGradient id="logoBlue"
                    x1="0" y1="0"
                    x2="48" y2="48"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#2685FF"/>
      <stop offset="1" stop-color="#0755DB"/>
    </linearGradient>
  </defs>

  <!-- Nền xanh -->
  <rect x="2" y="2"
        width="44" height="44"
        rx="11"
        fill="url(#logoBlue)"/>

  <!-- Ba cột biểu đồ -->
  <rect x="10" y="28"
        width="7" height="11"
        rx="1.5" fill="white"/>

  <rect x="21" y="20"
        width="7" height="19"
        rx="1.5" fill="white"/>

  <rect x="32" y="11"
        width="7" height="28"
        rx="1.5" fill="white"/>

</svg>
