name: kdh-report-admin
services:
  admin:
    build: .
    image: kdh-report-admin:demo
    init: true
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      APP_URL: ${APP_URL:-http://127.0.0.1:8090}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8090/api/google/callback}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-484358741}
      GSC_PROPERTY: ${GSC_PROPERTY:-https://kinderhealth.vn/}
      KEYWORD_SPREADSHEET_ID: ${KEYWORD_SPREADSHEET_ID:-1oVC_gc-_878btw6GJ9gQSDHJ7sqiGu2QB-lqMArqbSo}
      KEYWORD_SHEET: ${KEYWORD_SHEET:-Ranking}
      KEYWORD_TRACKING_YEAR: ${KEYWORD_TRACKING_YEAR:-}
      LEGACY_REPORT_DIR: /legacy
      DASHBOARD_URL: ${DASHBOARD_URL:-http://127.0.0.1:8088}
    volumes:
      - admin-data:/app/instance
      - type: bind
        source: ${LEGACY_REPORT_DIR:-../KDH-Report/KDH-Report}
        target: /legacy
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
volumes:
  admin-data:
