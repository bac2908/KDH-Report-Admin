<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập Admin để mở báo cáo</title><script src="/static/handoff-login.js" defer></script></head><body>
<main><h1>Đăng nhập Admin</h1><p>Phiên Admin đã hết hạn. Sau khi đăng nhập, báo cáo đã chọn sẽ mở tự động.</p>
<form id="handoff-login" data-transaction="{{ transaction }}"><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Mật khẩu <input name="password" type="password" autocomplete="current-password" required></label><button>Đăng nhập và mở báo cáo</button></form><p id="handoff-error" role="alert"></p></main></body></html>
